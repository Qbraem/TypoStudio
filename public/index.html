<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typo Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typo Studio">
<meta name="theme-color" content="#17110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#17110d; --panel:#211812; --panel2:#2b2018; --line:#3a2c22; --text:#f6ece0; --muted:#b39d89;
  --accent:#f26b50; --accent2:#e9b77c; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:14px 14px 96px;display:grid;gap:16px}
@media(min-width:900px){.app{grid-template-columns:minmax(300px,400px) 1fr;align-items:start;padding-bottom:30px}.stageCol{position:sticky;top:14px}}
.app>div{min-width:0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header h1 span{font-family:"Yellowtail",cursive;font-weight:400;color:var(--accent2);font-size:26px;margin-left:4px}
.status{font-size:12px;color:var(--muted)}

/* stage */
.stageWrap{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;border-radius:22px;overflow:hidden;
  background:#2a1b12;box-shadow:0 10px 40px rgba(0,0,0,.45);touch-action:none;max-height:62vh}
@media(max-width:899px){.stage{max-height:46vh;width:auto;height:46vh}}
.stage .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bg-warm{background:
  radial-gradient(circle at 30% 30%,rgba(255,196,120,.85) 0 6%,transparent 14%),
  radial-gradient(circle at 18% 36%,rgba(90,150,255,.6) 0 2.5%,transparent 5%),
  radial-gradient(ellipse at 70% 75%,#7a3a12 0,transparent 55%),
  radial-gradient(ellipse at 40% 70%,#a0521b 0,transparent 50%),
  linear-gradient(180deg,#3b2a20 0%,#5a3420 45%,#3a1d0e 100%)}
.bg-dark{background:#141414}
.bg-light{background:#efe7dc}
.bg-check{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/24px 24px}
.stage canvas.sticker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:grab;filter:none}
.stageTools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text)}
.chipbtn.on{background:var(--text);color:#1b130e;border-color:var(--text)}
.rangeRow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);max-width:340px;margin:0 auto;width:100%}
.rangeRow input{flex:1}
.hint{font-size:12px;color:var(--muted);text-align:center}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:999px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.hidden{display:none!important}

/* library */
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chipbtn{white-space:nowrap;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.card{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#2a1d16;aspect-ratio:1/1;padding:0;display:flex;align-items:center;justify-content:center}
.card.light{background:#efe7dc}
.card.sel{border-color:var(--accent)}
.card canvas{max-width:86%;max-height:80%}
.card .lbl{position:absolute;left:8px;bottom:6px;right:8px;font-size:11px;color:rgba(255,255,255,.65);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.light .lbl{color:rgba(0,0,0,.5)}
.card .mine{position:absolute;top:6px;right:8px;font-size:11px;color:var(--accent2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inlineNew{display:flex;gap:6px;margin-top:8px}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;flex:1;outline:none}
.inp:focus{border-color:var(--accent2)}
textarea.inp{width:100%;min-height:92px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{color:#ff9b87}
.btn:disabled{opacity:.5}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}

/* editor */
.sec{margin-bottom:14px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{outline:2px solid var(--text);outline-offset:2px}
.sw input[type=color]{width:34px;height:34px;border:0;background:none;padding:0}
.layer{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--panel2);overflow:hidden}
.layer summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.layer summary::-webkit-details-marker{display:none}
.layer summary .t{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer summary .f{font-size:12px;color:var(--muted)}
.layer .body{padding:4px 12px 12px;display:grid;gap:9px}
.ctl{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.ctl select{grid-column:2 / 4}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles .chipbtn{padding:6px 10px;font-size:12px}
input[type=range]{accent-color:var(--accent)}

/* ai */
.lab{font-size:13px;color:var(--muted);margin:10px 0 6px;display:block}
.aiOut{margin-top:12px}
.err{color:#ff9b87;font-size:13px;margin-top:8px}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ideas button{font-size:12px;padding:6px 10px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(23,17,13,0),var(--bg) 35%);display:flex;gap:8px;justify-content:center;z-index:5}
.bar .btn{flex:1;max-width:260px;padding:14px}
@media(min-width:900px){.bar{position:static;background:none;padding:0}}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:520px;width:100%;display:grid;gap:12px}
.modal img{width:100%;max-height:50vh;object-fit:contain;background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/20px 20px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#1b130e;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="stageCol stageWrap">
    <header>
      <h1>Typo <span>Studio</span></h1>
      <div class="status" id="status"></div>
    </header>
    <div class="stage" id="stage">
      <div class="bg bg-warm" id="stageBg"></div>
      <canvas class="sticker" id="sticker"></canvas>
    </div>
    <div class="stageTools" id="bgTools">
      <button class="chipbtn on" data-bg="warm">Warm</button>
      <button class="chipbtn" data-bg="dark">Donker</button>
      <button class="chipbtn" data-bg="light">Licht</button>
      <button class="chipbtn" data-bg="check">Transparant</button>
      <label class="chipbtn" style="cursor:pointer">📷 Eigen foto<input type="file" accept="image/*" id="photoIn" hidden></label>
    </div>
    <div class="rangeRow"><span>Grootte</span><input type="range" id="stickerScale" min="25" max="100" value="72"></div>
    <div class="hint">Sleep de tekst om te kijken hoe hij staat. De achtergrond zit niet in de PNG.</div>
    <div class="bar">
      <button class="btn" id="showBtn">Bekijk PNG</button>
      <button class="btn pri" id="dlBtn">⬇︎ Download PNG</button>
    </div>
  </div>

  <div>
    <div class="tabs" id="tabs">
      <button data-tab="lib" class="on">Bibliotheek</button>
      <button data-tab="edit">Bewerken</button>
      <button data-tab="ai">✨ Nieuw</button>
    </div>

    <section id="tab-lib" class="panel" style="margin-top:10px">
      <div class="cats" id="cats"></div>
      <div class="inlineNew hidden" id="newCatRow">
        <input class="inp" id="newCatName" placeholder="Naam nieuwe categorie" maxlength="40">
        <button class="btn pri" id="newCatOk">Maak</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="row hidden" id="catActions" style="margin-top:12px">
        <button class="btn" id="catAi">✨ Ontwerpen bijmaken</button>
        <button class="btn warn" id="catDel">Categorie verwijderen</button>
      </div>
    </section>

    <section id="tab-edit" class="panel hidden" style="margin-top:10px">
      <div class="sec">
        <h3>Naam</h3>
        <input class="inp" id="dName" style="width:100%">
      </div>
      <div class="sec">
        <h3>Hoofdkleur</h3>
        <div class="sw" id="swMain"></div>
      </div>
      <div class="sec">
        <h3>Accentkleur</h3>
        <div class="sw" id="swAccent"></div>
      </div>
      <div class="sec">
        <div class="ctl"><span>Schaduw</span><input type="range" id="dShadow" min="0" max="80"><output id="dShadowO"></output></div>
      </div>
      <div class="sec">
        <h3>Tekstlagen</h3>
        <div id="layers"></div>
        <button class="btn" id="addLayer">+ Laag toevoegen</button>
      </div>
      <div class="sec">
        <h3>Opslaan in categorie</h3>
        <div class="row">
          <select class="inp" id="saveCat"></select>
          <input class="inp hidden" id="saveCatNew" placeholder="Nieuwe categorie">
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn pri" id="saveBtn">Opslaan</button>
          <button class="btn" id="saveCopyBtn">Opslaan als kopie</button>
          <button class="btn warn hidden" id="delBtn">Verwijderen</button>
        </div>
        <div class="hint" id="saveHint" style="text-align:left;margin-top:8px"></div>
      </div>
    </section>

    <section id="tab-ai" class="panel hidden" style="margin-top:10px">
      <label class="lab" for="aiPrompt" style="margin-top:0">Wat wil je maken?</label>
      <textarea class="inp" id="aiPrompt" placeholder="Bv. gezellige kerst-koffie teksten, iets met 'Cozy Christmas' en 'Hot Cocoa Season', warm en speels"></textarea>
      <div class="ideas" id="ideas"></div>
      <label class="lab" for="aiCat">In categorie</label>
      <input class="inp" id="aiCat" list="catList" placeholder="Leeg = Claude kiest een naam" style="width:100%">
      <datalist id="catList"></datalist>
      <label class="lab">Aantal</label>
      <div class="toggles" id="aiCount">
        <button class="chipbtn" data-n="2">2</button>
        <button class="chipbtn on" data-n="4">4</button>
        <button class="chipbtn" data-n="6">6</button>
      </div>
      <label class="row" style="margin-top:12px;font-size:14px;gap:8px"><input type="checkbox" id="aiBase"> Gebruik de stijl van het huidige ontwerp als basis</label>
      <div class="row hidden" id="pinRow" style="margin-top:12px"><input class="inp" id="pinIn" type="password" inputmode="numeric" placeholder="Pincode" style="max-width:160px"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn pri" id="aiGo">✨ Genereer</button>
      </div>
      <div class="err" id="aiErr"></div>
      <div class="aiOut" id="aiOut"></div>
    </section>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="box">
    <div style="font-weight:700">Je PNG</div>
    <img id="modalImg" alt="Voorbeeld van de PNG">
    <div class="hint" style="text-align:left">Lukt downloaden niet? Houd de afbeelding ingedrukt en kies ‘Bewaar afbeelding’, of kopieer hem.</div>
    <div class="row">
      <button class="btn hidden" id="shareBtn">Bewaar in Foto's</button>
      <button class="btn" id="copyBtn">Kopieer</button>
      <button class="btn pri" id="modalDl">Download</button>
      <button class="btn" id="modalClose" style="margin-left:auto">Sluit</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Fonts ---------------- */
const FONTS = [
  {n:"Yellowtail",g:"Script",w:[400]},
  {n:"Great Vibes",g:"Script",w:[400]},
  {n:"Pinyon Script",g:"Script",w:[400]},
  {n:"Pacifico",g:"Script",w:[400]},
  {n:"Allura",g:"Script",w:[400]},
  {n:"Sacramento",g:"Script",w:[400]},
  {n:"Satisfy",g:"Script",w:[400]},
  {n:"Playball",g:"Script",w:[400]},
  {n:"Kaushan Script",g:"Script",w:[400]},
  {n:"Lobster",g:"Script",w:[400]},
  {n:"Dancing Script",g:"Script",w:[700]},
  {n:"Homemade Apple",g:"Handgeschreven",w:[400]},
  {n:"Caveat",g:"Handgeschreven",w:[400,700]},
  {n:"Nanum Pen Script",g:"Handgeschreven",w:[400]},
  {n:"Reenie Beanie",g:"Handgeschreven",w:[400]},
  {n:"Gochi Hand",g:"Handgeschreven",w:[400]},
  {n:"Shadows Into Light",g:"Handgeschreven",w:[400]},
  {n:"Luckiest Guy",g:"Bold & speels",w:[400]},
  {n:"Titan One",g:"Bold & speels",w:[400]},
  {n:"Bowlby One",g:"Bold & speels",w:[400]},
  {n:"Lilita One",g:"Bold & speels",w:[400]},
  {n:"Chewy",g:"Bold & speels",w:[400]},
  {n:"Fredoka",g:"Bold & speels",w:[700]},
  {n:"Shrikhand",g:"Bold & speels",w:[400]},
  {n:"Bungee",g:"Bold & speels",w:[400]},
  {n:"Rubik Mono One",g:"Bold & speels",w:[400]},
  {n:"Righteous",g:"Bold & speels",w:[400]},
  {n:"Playfair Display",g:"Serif",w:[400,700],it:true},
  {n:"DM Serif Display",g:"Serif",w:[400],it:true},
  {n:"Abril Fatface",g:"Serif",w:[400]},
  {n:"Cormorant Garamond",g:"Serif",w:[600],it:true},
  {n:"Fraunces",g:"Serif",w:[800],it:true},
  {n:"Montserrat",g:"Sans",w:[400,800]},
  {n:"DM Sans",g:"Sans",w:[400,700]},
  {n:"Bebas Neue",g:"Sans",w:[400]},
  {n:"Anton",g:"Sans",w:[400]},
  {n:"Archivo Black",g:"Sans",w:[400]},
];
const FONT_BY = Object.fromEntries(FONTS.map(f=>[f.n,f]));
FONTS.forEach(f=>{
  if(f.n==="DM Sans") return;
  let spec = f.n.replace(/ /g,"+");
  if(f.it) spec += ":ital,wght@" + [0,1].flatMap(i=>f.w.map(w=>i+","+w)).join(";");
  else if(!(f.w.length===1 && f.w[0]===400)) spec += ":wght@" + f.w.join(";");
  const l=document.createElement("link"); l.rel="stylesheet";
  l.href="https://fonts.googleapis.com/css2?family="+spec+"&display=block";
  l.onload=()=>{clearTimeout(window._fr);window._fr=setTimeout(()=>{fontCache.clear();schedulePreview();renderLibrary()},400)};
  document.head.appendChild(l);
});

/* ---------------- Seed designs ---------------- */
const W="#FFFFFF", CORAL="#F26B50";
function L(text,font,size,x,y,o={}){return Object.assign({text,font,weight:FONT_BY[font]?FONT_BY[font].w[FONT_BY[font].w.length-1]:400,italic:false,size,x,y,rotate:0,spacing:0,curve:0,upper:false,color:"main",style:"fill"},o)}
function D(id,cat,name,layers,o={}){return Object.assign({id,cat,name,layers,colors:{main:W,accent:CORAL},shadow:0,seed:true},o)}
const SEEDS = [
  // Ochtend
  D("s1","Ochtend","The Slow Mornings",[L("the","DM Serif Display",95,-330,-95),L("Slow","Yellowtail",270,70,-115,{rotate:-6}),L("Mornings","Yellowtail",270,0,120,{rotate:-6})]),
  D("s2","Ochtend","Morning Coffee",[L("Morning","Great Vibes",250,0,-60),L("COFFEE","Montserrat",105,0,115,{spacing:45})]),
  D("s3","Ochtend","But first, coffee",[L("but first,","Caveat",130,-110,-150,{rotate:-8,color:"accent"}),L("COFFEE","Bebas Neue",330,0,40)]),
  D("s4","Ochtend","Rise & Grind",[L("RISE","Shrikhand",210,0,-140),L("&","Yellowtail",170,0,0,{color:"accent"}),L("GRIND","Shrikhand",210,0,140)]),
  D("s5","Ochtend","Good Morning",[L("good","Pacifico",190,-90,-90,{rotate:-8}),L("MORNING","Titan One",165,0,95,{spacing:6})]),
  D("s6","Ochtend","Wake up & smell the coffee",[L("wake up &","Caveat",120,0,-165,{rotate:-4}),L("SMELL THE","Archivo Black",105,0,-55,{spacing:12}),L("coffee","Yellowtail",250,0,105,{rotate:-6,color:"accent"})]),
  // Coffee break
  D("s7","Coffee break","Coffee Break",[L("Coffee","Pacifico",230,0,-75,{rotate:-6}),L("BREAK","Titan One",185,0,125,{spacing:14,color:"accent"})]),
  D("s8","Coffee break","It's Coffee Time",[L("it's","Homemade Apple",95,-250,-150,{rotate:-12,color:"accent"}),L("COFFEE","Anton",250,0,-20),L("time","Yellowtail",230,40,150,{rotate:-6})]),
  D("s9","Coffee break","Pause & Sip",[L("pause","Playfair Display",210,0,-70,{italic:true,weight:400}),L("& SIP","DM Sans",90,0,85,{spacing:55,weight:700})]),
  D("s10","Coffee break","Refill please",[L("REFILL","Bowlby One",190,0,-50),L("please","Caveat",150,140,95,{rotate:-8,color:"accent"})]),
  D("s11","Coffee break","Coffee O'Clock",[L("COFFEE","Lilita One",200,0,-80,{spacing:4}),L("o'clock","Yellowtail",210,20,95,{rotate:-6,color:"accent"})]),
  // Gezellig
  D("s12","Gezellig","Coffee Lovers club",[L("COFFEE","Luckiest Guy",215,0,-140,{spacing:3}),L("LOVERS","Luckiest Guy",215,0,65,{spacing:3}),L("club","Homemade Apple",105,40,225,{rotate:-12,color:"accent",weight:400})]),
  D("s13","Gezellig","Cozy Vibes Only",[L("cozy","Pacifico",220,0,-90,{rotate:-5}),L("VIBES ONLY","Montserrat",88,0,85,{spacing:32,weight:800})]),
  D("s14","Gezellig","Home Barista",[L("HOME","Archivo Black",115,0,-120,{spacing:60}),L("barista","Yellowtail",280,0,55,{rotate:-6})]),
  D("s15","Gezellig","Sip Happens",[L("Sip","Shrikhand",230,-120,-60,{rotate:-6}),L("happens","Caveat",170,110,95,{rotate:-6,color:"accent"})]),
  D("s16","Gezellig","Coffee & Chill",[L("coffee","Great Vibes",240,0,-70),L("& CHILL","Bebas Neue",190,0,105,{spacing:22})]),
  // Brew & recept
  D("s17","Brew & recept","Pour Over",[L("slow brewed","DM Sans",58,0,-205,{spacing:40,curve:35,weight:700,upper:true,color:"accent"}),L("POUR","DM Serif Display",230,0,-55),L("over","Yellowtail",230,40,115,{rotate:-6,color:"accent"})]),
  D("s18","Brew & recept","Brew Day",[L("BREW","Bungee",220,0,-60),L("day","Pacifico",180,110,95,{rotate:-8,color:"accent"})]),
  D("s19","Brew & recept","Latte Art",[L("latte","Sacramento",280,0,-60),L("ART","Abril Fatface",190,0,110,{spacing:22})]),
  D("s20","Brew & recept","Fresh Beans",[L("FRESH","Rubik Mono One",135,0,-75),L("beans","Kaushan Script",200,0,85,{rotate:-6,color:"accent"})]),
  D("s21","Brew & recept","Recipe – Iced Latte",[L("RECIPE","DM Sans",70,0,-110,{spacing:80,weight:700,color:"accent"}),L("Iced Latte","Playfair Display",175,0,25,{italic:true,weight:700})]),
  // Weekdagen
  D("s22","Weekdagen","Monday Fuel",[L("MONDAY","Anton",215,0,-65),L("fuel","Yellowtail",230,60,95,{rotate:-8,color:"accent"})]),

/* ---------------- Rendering ---------------- */
function fontStr(Ly,px){return `${Ly.italic?"italic ":""}${Ly.weight||400} ${px}px "${Ly.font}", sans-serif`}
const fontCache=new Set();
async function ensureFonts(d){
  await Promise.all(d.layers.map(Ly=>{
    const k=fontStr(Ly,40); if(fontCache.has(k)) return;
    return document.fonts.load(k,Ly.text||"a").then(r=>{ if(r&&r.length) fontCache.add(k) }).catch(()=>{});
  }));
}
function colorOf(d,c){return c==="main"?d.colors.main:c==="accent"?d.colors.accent:(c||d.colors.main)}
function drawDesign(d,scale){
  const S=Math.round(2000*scale), c=document.createElement("canvas"); c.width=c.height=S;
  const ctx=c.getContext("2d"); const C=S/2;
  for(const Ly of d.layers){
    if(!Ly.text) continue;
    const px=Ly.size*scale; ctx.save();
    ctx.translate(C+Ly.x*scale, C+Ly.y*scale); ctx.rotate((Ly.rotate||0)*Math.PI/180);
    ctx.font=fontStr(Ly,px); const col=colorOf(d,Ly.color); ctx.fillStyle=col; ctx.strokeStyle=col;
    ctx.textBaseline="middle"; ctx.textAlign="center";
    if(d.shadow){ctx.shadowColor=`rgba(0,0,0,${(d.shadow/100)*0.75})`;ctx.shadowBlur=px*0.14;ctx.shadowOffsetY=px*0.035}
    const txt=Ly.upper?Ly.text.toUpperCase():Ly.text;
    const paint=(t,x,y)=>{ if(Ly.style==="outline"){ctx.lineWidth=Math.max(1,px*0.035);ctx.lineJoin="round";ctx.strokeText(t,x,y)} else ctx.fillText(t,x,y) };
    const sp=(Ly.spacing||0)/100*px, curve=Ly.curve||0;
    if(!sp && !curve){ paint(txt,0,0) }
    else{
      const ch=[...txt], ws=ch.map(x=>ctx.measureText(x).width);
      const total=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
      if(!curve){ let x=-total/2; ch.forEach((t,i)=>{paint(t,x+ws[i]/2,0);x+=ws[i]+sp}) }
      else{
        const span=Math.abs(curve)/100*Math.PI, R=total/span, dir=curve>0?1:-1; let a=-span/2;
        ch.forEach((t,i)=>{const mid=a+(ws[i]/2)/R; ctx.save(); ctx.translate(R*Math.sin(mid), dir*R*(1-Math.cos(mid))); ctx.rotate(dir*mid); paint(t,0,0); ctx.restore(); a+=(ws[i]+sp)/R});
      }
    }
    ctx.restore();
  }
  return trim(c);
}
function trim(c){
  const w=c.width,h=c.height,data=c.getContext("2d").getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++){const row=y*w*4;let found=false;
    for(let x=0;x<w;x++){ if(data[row+x*4+3]>6){found=true; if(x<x0)x0=x; break} }
    if(found){ if(y<y0)y0=y; y1=y; for(let x=w-1;x>=0;x--){ if(data[row+x*4+3]>6){ if(x>x1)x1=x; break} } }
  }
  if(x1<0){const e=document.createElement("canvas");e.width=e.height=10;return e}
  const pad=Math.round(Math.max(x1-x0,y1-y0)*0.04)+2;
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}
function lum(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return 1;const n=parseInt(m[1],16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}

function schedulePreview(){ if(previewQueued) return; previewQueued=true; requestAnimationFrame(async()=>{ previewQueued=false; await ensureFonts(cur); const t=drawDesign(cur,0.6); const s=$("sticker"); s.width=t.width; s.height=t.height; s.getContext("2d").drawImage(t,0,0); layoutSticker() }) }
function layoutSticker(){
  const s=$("sticker"), st=$("stage"), pct=+$("stickerScale").value/100;
  const maxW=st.clientWidth*pct; const ratio=s.height/s.width;
  let w=maxW; if(w*ratio>st.clientHeight*0.8) w=st.clientHeight*0.8/ratio;
  s.style.width=w+"px"; s.style.left=stickerPos.x+"%"; s.style.top=stickerPos.y+"%";
}

(function drag(){
  const s=$("sticker"),st=$("stage");let on=false,ox=0,oy=0;
  s.addEventListener("pointerdown",e=>{on=true;s.setPointerCapture(e.pointerId);const r=st.getBoundingClientRect();ox=e.clientX-(r.left+r.width*stickerPos.x/100);oy=e.clientY-(r.top+r.height*stickerPos.y/100)});
  s.addEventListener("pointermove",e=>{if(!on)return;const r=st.getBoundingClientRect();stickerPos.x=Math.min(95,Math.max(5,(e.clientX-ox-r.left)/r.width*100));stickerPos.y=Math.min(95,Math.max(5,(e.clientY-oy-r.top)/r.height*100));layoutSticker()});
  ["pointerup","pointercancel"].forEach(ev=>s.addEventListener(ev,()=>on=false));
})();

        ${f.w.length>1?`<button class="chipbtn ${Ly.weight===Math.max(...f.w)?"on":""}" data-t="bold">Vet</button>`:""}
        <button class="chipbtn ${Ly.style==="outline"?"on":""}" data-t="outline">Contour</button>
      </div>
      <div class="row">
        <button class="btn" data-a="up">↑</button><button class="btn" data-a="down">↓</button>

      </div>

    const sum=det.querySelector(".t");
    det.querySelectorAll("[data-k]").forEach(inp=>{

        else if(k==="font"){Ly.font=inp.value;const nf=FONT_BY[Ly.font];if(!nf.w.includes(Ly.weight))Ly.weight=nf.w[nf.w.length-1];if(!nf.it)Ly.italic=false;renderEditor();}
        else{Ly[k]=+inp.value;const o=inp.parentElement.querySelector("output");if(o)o.textContent=inp.value}
        schedulePreview();

    det.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
      const t=b.dataset.t;
      if(t==="color")Ly.color=b.dataset.v; else if(t==="upper")Ly.upper=!Ly.upper; else if(t==="italic")Ly.italic=!Ly.italic;

/* Standalone (eigen website): AI via eigen server, opslag in deze browser */
let standalone=false;
function getPin(){try{return localStorage.getItem("typoStudio.pin")||""}catch(e){return ""}}
function setPin(v){try{localStorage.setItem("typoStudio.pin",v)}catch(e){}}
async function initStandalone(){
  standalone=true;
  try{
    const cfg=await fetch("/api/config").then(r=>r.json());
    if(cfg.ai){
      if(cfg.pin) $("pinRow").classList.remove("hidden");
      $("pinIn").value=getPin();
      sampleCap={json:async(input)=>{
        const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:input,pin:$("pinIn").value.trim()})});
        const j=await r.json().catch(()=>({}));
        if(r.status===401) throw {code:"bad_pin"};
        if(r.status===429) throw {code:"rate_limited"};
        if(!r.ok) throw {code:"server",message:j.error||""};
        if($("pinIn").value.trim()) setPin($("pinIn").value.trim());
        return j.result;
      }};
    }
  }catch(e){}
}
async function initCaps(){
  if(!window.claude||!window.claude.use){ initStandalone(); return }
  claude.use("downloads").then(x=>downloadsCap=x).catch(()=>{});
  claude.use("sample").then(x=>{sampleCap=x}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(db&&user){
      const id=await user.id();
      if(id){
        const col=db.collection("data/users/"+id);
        const snap=await withTimeout(col.get(),10000);
        const dbDesigns=[];let dbCats=null;
        snap.docs.forEach(s=>{const v=s.data();if(!v)return;if(s.id==="meta")dbCats=v.cats||[];else if(Array.isArray(v.layers))dbDesigns.push(v)});
        store={mode:"db",col};
        // merge anything only kept locally (first visit after local use)
        const ids=new Set(dbDesigns.map(d=>d.id));
        const localOnly=custom.filter(d=>!ids.has(d.id));
        custom=[...localOnly,...dbDesigns.sort((a,b)=>(b.t||0)-(a.t||0))];
        customCats=[...new Set([...(dbCats||[]),...customCats])];
        for(const d of localOnly) await col.doc(d.id).set(d);
        if(localOnly.length||dbCats===null&&customCats.length) await col.doc("meta").set({cats:customCats});
        saveLocal(); renderLibrary();
      }
    }
  }catch(e){ $("status").textContent="Opslaan: alleen in deze browser" }
}

/* ---------------- Export ---------------- */
const QUALITY=1.6;
let lastBlob=null,lastUrl=null;
async function makePng(){
  await ensureFonts(cur);
  const c=drawDesign(cur,QUALITY);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  if(lastUrl)URL.revokeObjectURL(lastUrl); lastBlob=blob; lastUrl=URL.createObjectURL(blob); return blob;
}
function fileName(){return (cur.name||"typo").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".png"}
async function download(){
  const btn=$("dlBtn"); btn.disabled=true;
  try{
    const blob=await makePng();
    if(downloadsCap){
      try{await downloadsCap.save({filename:fileName(),data:blob});toast("PNG opgeslagen ✓");return}
      catch(e){ if(e&&e.code==="declined") return; }
    }
    if(standalone){
      const a=document.createElement("a");a.href=lastUrl;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
      toast("PNG gedownload ✓");return;
    }
    openModal();
  }finally{btn.disabled=false}
}
function openModal(){
  $("modalImg").src=lastUrl;$("modal").classList.remove("hidden");
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[new File([lastBlob],fileName(),{type:"image/png"})]}))}catch(e){}
  $("shareBtn").classList.toggle("hidden",!can);
}
document.addEventListener("click",async e=>{
  if(e.target.id!=="shareBtn")return;
  try{await navigator.share({files:[new File([lastBlob],fileName(),{type:"image/png"})]})}catch(err){}
});
$("dlBtn").onclick=download;
$("showBtn").onclick=async()=>{await makePng();openModal()};
$("modalDl").onclick=download;
$("modalClose").onclick=()=>$("modal").classList.add("hidden");
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").classList.add("hidden")});
$("copyBtn").onclick=async()=>{
  try{await navigator.clipboard.write([new ClipboardItem({"image/png":lastBlob})]);toast("Gekopieerd ✓")}
  catch(e){toast("Kopiëren lukt hier niet – houd de afbeelding ingedrukt")}
};

/* ---------------- AI ---------------- */
const IDEAS=["Kerst & cocoa","Valentijn koffie-date","Zomer iced coffee","Maandagmotivatie","Nederlandstalige koffiegrapjes","Bakdag & koffie","Lente brunch"];
$("ideas").innerHTML=IDEAS.map(i=>`<button class="chipbtn">${i}</button>`).join("");
$("ideas").onclick=e=>{const b=e.target.closest("button");if(b){$("aiPrompt").value=b.textContent}};
let aiN=4;
$("aiCount").onclick=e=>{const b=e.target.closest("[data-n]");if(!b)return;aiN=+b.dataset.n;document.querySelectorAll("#aiCount button").forEach(x=>x.classList.toggle("on",x===b))};
function refreshCatList(){$("catList").innerHTML=allCats().map(c=>`<option value="${esc(c)}">`).join("")}

function aiInstructions(){
  const fontList=FONTS.map(f=>`- "${f.n}" (${f.g}; weights ${f.w.join("/")}${f.it?"; italic allowed":""})`).join("\n");
  const ex=[SEEDS[0],SEEDS[11],SEEDS[1]].map(d=>JSON.stringify({name:d.name,colors:d.colors,shadow:0,layers:d.layers})).join("\n");
  return `You design typographic text stickers (transparent PNG overlays) for Instagram stories and posts, in the style of popular coffee/lifestyle accounts: a big flowing script word combined with a bold, chunky or letter-spaced word, small accent words in handwriting, slight playful rotations.

COORDINATES: a 1000x1000 space with origin at the centre; x to the right, y downward. Each layer is ONE line of text drawn centred on (x,y). "size" is the font size in that space (typically 60–320). The whole composition must fit in about 900 wide x 650 tall, so keep long lines smaller. Script fonts are wide: a 7-letter script word at size 260 is roughly 850 wide; caps sans at size 100 with spacing 40 is about 85 per letter. Lines overlapping slightly is fine and looks good (like a stacked logo), but they must stay readable.

LAYER FIELDS: text, font, weight, italic (bool), size, x, y, rotate (degrees, usually 0 or -4..-12 for script/handwritten accents), spacing (letter spacing in % of size, 0–80; only for caps/sans/serif, NEVER for script or handwritten fonts), curve (-100..100 arc; positive = arched like a rainbow; use rarely, only for small caps words), upper (bool), color ("main" or "accent"), style ("fill" or "outline").
DESIGN FIELDS: name (short), colors {main, accent} as #RRGGBB (default main #FFFFFF; pick an accent that suits the theme), shadow (0 normally; 30–50 only if asked for more contrast), layers (1–4 layers).

ALLOWED FONTS (exact names, only listed weights):
${fontList}

RULES: Every design uses a different font pairing and layout. Texts are short and catchy (1–4 words per line). Use the language the user asks for; if not specified, use English like these examples. Use "accent" colour for at most 1–2 small layers.

EXAMPLES:
${ex}

Reply with ONLY JSON: {"category":"short category name (2–3 words) fitting the request","designs":[ ...designs... ]}`;
}
function sanitizeDesign(d,cat){
  if(!d||!Array.isArray(d.layers)) return null;
  const hex=v=>/^#[0-9a-f]{6}$/i.test(v||"")?v.toUpperCase():null;
  const num=(v,a,b,def)=>{v=+v;return isFinite(v)?Math.min(b,Math.max(a,v)):def};
  const layers=d.layers.slice(0,5).map(x=>{
    const f=FONT_BY[x.font]||FONT_BY["Caveat"];
    const w=f.w.includes(+x.weight)?+x.weight:f.w[f.w.length-1];
    return {text:String(x.text||"").slice(0,40),font:f.n,weight:w,italic:!!(x.italic&&f.it),size:num(x.size,20,420,150),x:num(x.x,-500,500,0),y:num(x.y,-500,500,0),rotate:num(x.rotate,-45,45,0),spacing:num(x.spacing,0,100,0),curve:num(x.curve,-100,100,0),upper:!!x.upper,color:x.color==="accent"?"accent":"main",style:x.style==="outline"?"outline":"fill"};
  }).filter(x=>x.text);
  if(!layers.length) return null;
  return {id:uid(),cat,name:String(d.name||layers.map(l=>l.text).join(" ")).slice(0,60),colors:{main:hex(d.colors&&d.colors.main)||W,accent:hex(d.colors&&d.colors.accent)||CORAL},shadow:num(d.shadow,0,80,0),layers,seed:false,t:Date.now()};
}
$("aiGo").onclick=async()=>{
  const prompt=$("aiPrompt").value.trim(); const err=$("aiErr"); err.textContent="";
  if(!prompt){err.textContent="Schrijf eerst kort wat je wil.";$("aiPrompt").focus();return}
  if(!sampleCap){err.textContent=standalone?"De AI-generator staat nog niet aan op deze website (er is geen API-sleutel ingesteld).":"De AI-generator is hier niet beschikbaar.";return}
  const btn=$("aiGo"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Bezig met ontwerpen…';
  try{
    const catWanted=$("aiCat").value.trim();
    let user=`Request: ${prompt}\nNumber of designs: ${aiN}`;
    if(catWanted) user+=`\nCategory: ${catWanted}`;
    if($("aiBase").checked) user+=`\nBase the style (fonts, layout, colours) on this design, making variations with new texts:\n${JSON.stringify({name:cur.name,colors:cur.colors,shadow:cur.shadow,layers:cur.layers})}`;
    const res=await sampleCap.json(aiInstructions()+"\n\n"+user,{modelTier:"default"});
    const cat=catWanted||String(res&&res.category||"AI ontwerpen").slice(0,40);
    const made=(res&&Array.isArray(res.designs)?res.designs:[]).map(d=>sanitizeDesign(d,cat)).filter(Boolean);
    if(!made.length){err.textContent="Er kwam niets bruikbaars terug. Probeer het nog eens.";return}
    custom=[...made,...custom];
    if(!SEED_CATS.includes(cat)&&!customCats.includes(cat)){customCats.unshift(cat);await saveMeta()}
    for(const d of made) await putDesign(d);
    cur=clone(made[0]); curSourceId=made[0].id; schedulePreview();
    activeCat=cat; renderLibrary(); showTab("lib");
    toast(`${made.length} nieuwe ontwerpen in ${cat}`);
  }catch(e){
    if(e&&e.code==="bad_pin"){ err.textContent="Verkeerde of ontbrekende pincode."; $("pinIn").focus(); }
    else if(e&&e.code==="not_granted") err.textContent="Toegang tot Claude werd niet toegestaan.";
    else if(e&&e.code==="rate_limited") err.textContent="Even te veel tegelijk – probeer het over een minuutje opnieuw.";
    else err.textContent="Er liep iets mis bij het genereren. Probeer het opnieuw.";
  }finally{btn.disabled=false;btn.textContent="✨ Genereer"}
};

loadLocal();
renderLibrary();
document.fonts.ready.then(()=>{schedulePreview();renderLibrary()});
schedulePreview();
initCaps();
