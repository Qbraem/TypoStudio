<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typo Studio</title>
<meta name="theme-color" content="#17110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typo Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#120d0a; --panel:#1f1712; --panel2:#2a2019; --line:#3a2c22; --text:#f6ece0; --muted:#b39d89;
  --accent:#f26b50; --accent2:#e9b77c;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  --app-h:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",-apple-system,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}

/* ---------- App shell (iPhone eerst) ---------- */
.shell{position:fixed;left:0;right:0;top:0;height:var(--app-h);display:grid;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "sheet" "tabs"}
.shell>*{min-width:0}
.top{grid-area:top;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) calc(12px + var(--sar)) 6px calc(12px + var(--sal));min-height:52px}
.brand{font-weight:700;font-size:17px;flex:1;white-space:nowrap}
.brand span{font-family:"Yellowtail",cursive;font-weight:400;color:var(--accent2);font-size:22px;margin-left:3px}
.iconbtn{min-width:44px;height:44px;border-radius:22px;border:0;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700;font-size:15px}
.iconbtn svg{width:20px;height:20px}
.iconbtn.pri{background:var(--accent);color:#fff;padding:0 16px}
.iconbtn:disabled{opacity:.35}
.iconbtn.busy{opacity:.7}

.stageArea{grid-area:stage;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px calc(12px + var(--sar)) 8px calc(12px + var(--sal))}
.stage{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:#2a1b12;touch-action:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.stage .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bg-warm{background:radial-gradient(circle at 30% 30%,rgba(255,196,120,.85) 0 6%,transparent 14%),radial-gradient(ellipse at 70% 75%,#7a3a12 0,transparent 55%),radial-gradient(ellipse at 40% 70%,#a0521b 0,transparent 50%),linear-gradient(180deg,#3b2a20 0%,#5a3420 45%,#3a1d0e 100%)}
.bg-dark{background:#141414}.bg-light{background:#efe7dc}
.bg-check{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/22px 22px}
#sticker{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.bgRow{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:24px;background:rgba(20,14,10,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bgRow::-webkit-scrollbar{display:none}
.bgBtn{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0;overflow:hidden;background:#333;position:relative}
.bgBtn img{width:100%;height:100%;object-fit:cover;display:block}
.bgBtn.on{border-color:#fff}
.bgBtn.bg-warm{background:linear-gradient(135deg,#e9a35a,#5a3420)}.bgBtn.bg-dark{background:#141414}.bgBtn.bg-light{background:#efe7dc}
.bgBtn.bg-check{background:repeating-conic-gradient(#666 0 25%,#333 0 50%) 0 0/12px 12px}
.bgBtn .lab{font-size:15px;line-height:32px}
.coach{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;border-radius:12px;background:rgba(20,14,10,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;text-align:center;transition:opacity .4s;pointer-events:none}

/* sheet */
.sheet{grid-area:sheet;height:var(--sheet-h,42%);background:var(--panel);border-radius:18px 18px 0 0;display:flex;flex-direction:column;min-height:0;box-shadow:0 -6px 24px rgba(0,0,0,.35);transition:height .25s ease}
.sheet.dragging{transition:none}
.grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:3px;background:#5a4636}
.sheetBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 calc(14px + var(--sar)) 14px calc(14px + var(--sal))}

.tabs{grid-area:tabs;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:700;min-height:50px}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}

/* breed scherm: iPhone Duo ingeklapt (liggend), uitgeklapt liggend, iPad, computer
   -> foto links over de volle hoogte, paneel rechts */
@media (min-aspect-ratio: 1/1), (min-width: 900px){
  .shell{grid-template-columns:minmax(0,1fr) clamp(300px,44vw,440px);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"stage top" "stage tabs" "stage sheet"}
  .top{padding:calc(var(--sat) + 4px) calc(10px + var(--sar)) 4px 12px;min-height:48px;border-left:1px solid var(--line);background:var(--panel)}
  .stageArea{padding:calc(var(--sat) + 8px) 8px calc(var(--sab) + 8px) calc(8px + var(--sal))}
  .sheet{height:auto!important;border-radius:0;box-shadow:none;border-left:1px solid var(--line)}
  .grab{display:none}
  .tabs{border-top:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 var(--sar) 0 0}
  .tabs button{flex-direction:row;justify-content:center;gap:6px;font-size:13px;min-height:44px;padding:0}
  .tabs svg{width:20px;height:20px}
  .sheetBody{padding:12px calc(14px + var(--sar)) calc(14px + var(--sab)) 14px}
  .chips,.toolbar{margin-left:-14px;margin-right:calc(-14px - var(--sar))}
  .chips{padding-left:14px}
}
/* laag scherm (bv. iPhone Duo ingeklapt): alles compacter */
@media (max-height: 560px){
  .brand{font-size:15px}.brand span{font-size:19px}
  .iconbtn{height:40px;min-width:40px}
  .iconbtn.pri{padding:0 12px}
  .bgBtn{width:30px;height:30px}
  .coach{font-size:12px;padding:6px 10px}
  .fontBtn{min-height:54px}.fontBtn .s{font-size:20px}
}
@media (max-height: 560px) and (max-aspect-ratio: 1/1){ .brand{display:none} }
/* groot scherm: 9:16-kader zoals een Instagram-story */
@media (min-width: 1100px) and (min-height: 700px){
  .stage{width:auto;max-width:100%;aspect-ratio:9/16}
  .shell{grid-template-columns:minmax(0,1fr) 440px}
}

/* ---------- Gedeelde controls ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 calc(-14px - var(--sal)) 0 calc(-14px - var(--sar));padding-left:calc(14px + var(--sal));padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:0 14px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--text);color:#1b130e;border-color:var(--text)}
.chip.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.stickyTop{position:sticky;top:0;background:var(--panel);z-index:2;padding-top:2px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;min-height:44px}
.inp:focus{border-color:var(--accent2)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none}
.btn{min-height:44px;border-radius:12px;padding:0 16px;font-weight:700;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{color:#ff9b87}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.err{color:#ff9b87;font-size:14px;margin-top:8px}
.ctl{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:44px}
.ctl output{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#4a3a2e}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#4a3a2e}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}

/* library */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
.card{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#2a1d16 center/cover;aspect-ratio:1/1;padding:0;display:flex;align-items:center;justify-content:center}
.card.light{background:#efe7dc}
.card.sel{border-color:var(--accent)}
.card canvas{max-width:86%;max-height:72%}
.card .mine{position:absolute;top:4px;right:7px;font-size:11px;color:var(--accent2)}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center;grid-column:1/-1}

/* editor */
.layerChip{max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.toolbar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 calc(-14px - var(--sar)) 10px calc(-14px - var(--sal));padding:0 14px}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{flex:none;border:0;background:none;min-height:44px;padding:0 10px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.toolbar button.on{color:var(--text);border-bottom-color:var(--accent)}
.fontGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:600px){.fontGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fontBtn{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.fontBtn .s{font-size:24px;line-height:1.15;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fontBtn .n{font-size:10px;color:var(--muted);font-family:"DM Sans",sans-serif}
.fontBtn.on{border-color:var(--accent);background:#3a2419}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{outline:2px solid var(--text);outline-offset:2px}
.sw input[type=color]{width:40px;height:40px;border:0;background:none;padding:0}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:var(--panel);border-radius:20px 20px 0 0;padding:16px calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));width:100%;max-width:560px;display:grid;gap:12px}
@media(min-width:900px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal img{width:100%;max-height:45vh;object-fit:contain;background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/20px 20px;border-radius:12px;-webkit-touch-callout:default}
.modal .row .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);background:var(--text);color:#1b130e;padding:10px 16px;border-radius:22px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Typo <span>Studio</span></div>
    <button class="iconbtn hidden" id="undoBtn" aria-label="Ongedaan maken" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="iconbtn" id="viewBtn" aria-label="Bekijk PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="iconbtn pri" id="saveImgBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Bewaar</button>
  </header>

  <main class="stageArea">
    <div class="stage" id="stage">
      <div class="bg" id="stageBg" style="background-image:url('/img/bg-beans.jpg')"></div>
      <canvas id="sticker"></canvas>
      <div class="coach hidden" id="coach">Tik op een tekst · sleep om te verplaatsen · knijp om te schalen en draaien</div>
      <div class="bgRow" id="bgRow">
        <button class="bgBtn on" data-photo="beans" aria-label="Koffiebonen"><img src="/img/th-beans.jpg" alt=""></button>
        <button class="bgBtn" data-photo="sunset" aria-label="Zonsondergang"><img src="/img/th-sunset.jpg" alt=""></button>
        <button class="bgBtn" data-photo="pier" aria-label="Golfbreker"><img src="/img/th-pier.jpg" alt=""></button>
        <button class="bgBtn bg-warm" data-bg="warm" aria-label="Warm"></button>
        <button class="bgBtn bg-dark" data-bg="dark" aria-label="Donker"></button>
        <button class="bgBtn bg-light" data-bg="light" aria-label="Licht"></button>
        <button class="bgBtn bg-check" data-bg="check" aria-label="Transparant"></button>
        <label class="bgBtn" aria-label="Eigen foto" style="display:flex;align-items:center;justify-content:center;cursor:pointer"><span class="lab">📷</span><input type="file" accept="image/*" id="photoIn" hidden></label>
      </div>
    </div>
  </main>

  <section class="sheet" id="sheet">
    <div class="grab" id="grab" aria-label="Paneel groter of kleiner"><i></i></div>
    <div class="sheetBody" id="sheetBody">
      <!-- Bibliotheek -->
      <div id="tab-lib">
        <div class="stickyTop"><div class="chips" id="cats"></div>
          <div class="row hidden" id="newCatRow" style="margin-bottom:10px;flex-wrap:nowrap"><input class="inp" id="newCatName" placeholder="Naam nieuwe categorie" maxlength="40"><button class="btn pri" id="newCatOk">Maak</button></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="row hidden" id="catActions" style="margin-top:14px"><button class="btn" id="catGen">✨ Ontwerpen bijmaken</button><button class="btn warn" id="catDel">Categorie verwijderen</button></div>
      </div>

      <!-- Bewerken -->
      <div id="tab-edit" class="hidden">
        <div class="stickyTop">
          <div class="chips" id="layerChips"></div>
          <div class="toolbar" id="toolbar">
            <button data-tool="text" class="on">Tekst</button>
            <button data-tool="font">Lettertype</button>
            <button data-tool="size">Grootte</button>
            <button data-tool="pos">Positie</button>
            <button data-tool="style">Stijl</button>
            <button data-tool="colors">Kleuren</button>
            <button data-tool="save">Opslaan</button>
          </div>
        </div>
        <div id="toolBody"></div>
      </div>

      <!-- Nieuw -->
      <div id="tab-gen" class="hidden">
        <label class="lab" for="genText" style="margin-top:4px">Je tekst <span style="opacity:.7">(één zin per regel)</span></label>
        <textarea class="inp" id="genText" placeholder="Cozy Christmas&#10;Hot Cocoa Season"></textarea>
        <div class="chips" style="margin-top:8px"><button class="chip" id="genInspire">💡 Inspiratie</button><button class="chip" id="genInspireNL">💡 Nederlands</button></div>
        <label class="lab">Stijl</label>
        <div class="chips" id="genStyle"><button class="chip on" data-s="mix">Mix</button><button class="chip" data-s="script">Sierlijk</button><button class="chip" data-s="bold">Speels & bold</button><button class="chip" data-s="clean">Strak</button></div>
        <label class="lab">Kleuren</label>
        <div class="chips" id="genColors"></div>
        <label class="lab" for="genCat">In categorie</label>
        <input class="inp" id="genCat" list="catList" placeholder="Bv. Kerst"><datalist id="catList"></datalist>
        <label class="lab">Varianten per zin</label>
        <div class="chips" id="genCount"><button class="chip" data-n="2">2</button><button class="chip on" data-n="4">4</button><button class="chip" data-n="6">6</button></div>
        <button class="btn pri" id="genGo" style="width:100%;margin-top:8px">✨ Maak ontwerpen</button>
        <div class="err" id="genErr"></div>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="lib" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Bibliotheek</button>
    <button data-tab="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Bewerken</button>
    <button data-tab="gen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Nieuw</button>
  </nav>
</div>

<div class="modal hidden" id="modal">
  <div class="box">
    <div class="row" style="justify-content:space-between"><b>Je PNG</b><button class="btn" id="modalClose" style="min-height:36px">Sluit</button></div>
    <img id="modalImg" alt="Voorbeeld van de PNG">
    <div class="hint">Tip: houd de afbeelding ingedrukt → ‘Bewaar in Foto's’. Of gebruik de knoppen.</div>
    <div class="row"><button class="btn pri hidden" id="modalShare">Bewaar in Foto's</button><button class="btn" id="modalDl">Download</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Fonts ---------------- */
const FONTS = [
  {n:"Yellowtail",g:"Script",w:[400]},
  {n:"Great Vibes",g:"Script",w:[400]},
  {n:"Pinyon Script",g:"Script",w:[400]},
  {n:"Pacifico",g:"Script",w:[400]},
  {n:"Allura",g:"Script",w:[400]},
  {n:"Sacramento",g:"Script",w:[400]},
  {n:"Satisfy",g:"Script",w:[400]},
  {n:"Playball",g:"Script",w:[400]},
  {n:"Kaushan Script",g:"Script",w:[400]},
  {n:"Lobster",g:"Script",w:[400]},
  {n:"Dancing Script",g:"Script",w:[700]},
  {n:"Homemade Apple",g:"Handgeschreven",w:[400]},
  {n:"Caveat",g:"Handgeschreven",w:[400,700]},
  {n:"Nanum Pen Script",g:"Handgeschreven",w:[400]},
  {n:"Reenie Beanie",g:"Handgeschreven",w:[400]},
  {n:"Gochi Hand",g:"Handgeschreven",w:[400]},
  {n:"Shadows Into Light",g:"Handgeschreven",w:[400]},
  {n:"Luckiest Guy",g:"Bold & speels",w:[400]},
  {n:"Titan One",g:"Bold & speels",w:[400]},
  {n:"Bowlby One",g:"Bold & speels",w:[400]},

const FRAME=1100, QUALITY=1.4;
function fontStr(Ly,px){return `${Ly.italic?"italic ":""}${Ly.weight||400} ${px}px "${Ly.font}", sans-serif`}

async function ensureFonts(d){

    return document.fonts.load(k,Ly.text||"a").then(r=>{if(r&&r.length)fontCache.add(k)}).catch(()=>{})}));
}
function colorOf(d,c){return c==="main"?d.colors.main:c==="accent"?d.colors.accent:(c||d.colors.main)}
function drawLayers(ctx,d,s,Cx,Cy,opts={}){
  const boxes=[];
  d.layers.forEach((Ly,i)=>{
    if(!Ly.text){boxes.push(null);return}
    const px=Ly.size*s; ctx.save();
    ctx.translate(Cx+Ly.x*s,Cy+Ly.y*s); ctx.rotate((Ly.rotate||0)*Math.PI/180);
    ctx.font=fontStr(Ly,px); const col=colorOf(d,Ly.color); ctx.fillStyle=col; ctx.strokeStyle=col;

    if(d.shadow){ctx.shadowColor=`rgba(0,0,0,${(d.shadow/100)*.75})`;ctx.shadowBlur=px*.14;ctx.shadowOffsetY=px*.035}
    const txt=Ly.upper?Ly.text.toUpperCase():Ly.text;

      if(!isFinite(l)||!isFinite(t)){l=r=m.width/2;t=b=px*.5}}
    else{
      const ch=[...txt],ws=ch.map(x=>ctx.measureText(x).width),total=ws.reduce((a,c)=>a+c,0)+sp*(ch.length-1);
      l=r=total/2;t=b=px*.55;
      if(!curve){let x=-total/2;ch.forEach((c,k)=>{paint(c,x+ws[k]/2,0);x+=ws[k]+sp})}
      else{const span=Math.abs(curve)/100*Math.PI,R=total/span,dir=curve>0?1:-1;let a=-span/2;
        ch.forEach((c,k)=>{const mid=a+(ws[k]/2)/R;ctx.save();ctx.translate(R*Math.sin(mid),dir*R*(1-Math.cos(mid)));ctx.rotate(dir*mid);paint(c,0,0);ctx.restore();a+=(ws[k]+sp)/R});

    }

      ctx.shadowColor="transparent";const p=8*(opts.dpr||1);

      ctx.strokeStyle="rgba(0,0,0,.55)";ctx.strokeRect(-l-p+1,-t-p+1,l+r+2*p,t+b+2*p);

    }

  });

}
function drawExport(d,scale){
  const S=Math.round(2000*scale),c=document.createElement("canvas");c.width=c.height=S;
  drawLayers(c.getContext("2d"),d,scale,S/2,S/2);return trim(c);
}
function trim(c){
  const w=c.width,h=c.height,data=c.getContext("2d").getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++){const row=y*w*4;let f=false;
    for(let x=0;x<w;x++){if(data[row+x*4+3]>6){f=true;if(x<x0)x0=x;break}}
    if(f){if(y<y0)y0=y;y1=y;for(let x=w-1;x>=0;x--){if(data[row+x*4+3]>6){if(x>x1)x1=x;break}}}}
  if(x1<0){const e=document.createElement("canvas");e.width=e.height=10;return e}
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.04)+2;
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}

    previewQueued=false;await ensureFonts(cur);
    const st=$("stage"),cv=$("sticker");const W=st.clientWidth,H=st.clientHeight;if(!W||!H)return;

(function gestures(){

  function hit(u){
    let best=-1,bd=1e9;

      const a=-(Ly.rotate||0)*Math.PI/180,dx=u.x-Ly.x,dy=u.y-Ly.y,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a),m=24;

  }

    if(e.target.closest(".bgRow"))return;
    st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(tab==="edit"){
      if(pts.size===1){const u=toUnits(e.clientX,e.clientY);const h=hit(u);
        if(h>=0&&h!==sel){sel=h;renderLayerChips();renderTool()}
        if(h<0){g=null;return}
        snap();g={mode:"drag",sx:e.clientX,sy:e.clientY,x0:layer().x,y0:layer().y,k:u.k,moved:false};hideCoach()}

  scriptStack(p){const sf=pick(POOLS.script);let parts=splitWords(p);let pre=null;
    if(/^the\s/i.test(p)&&parts.length>1){pre="the";parts=splitWords(p.replace(/^the\s+/i,""));}
    const ls=parts.map(t=>mkLayer(t,sf,{rotate:-6,max:270}));
    if(pre){const top=ls[0];stack(ls);return [mkLayer("the",pick(POOLS.serif),{size:Math.round(top.size*.36),x:-Math.round(fitW(top)/2)-30,y:top.y}),...ls]}
    return stack(ls);},
  // schrijfletter + gespatieerde hoofdletters
  scriptCaps(p){const [a,b]=splitWords(p);if(!b)return null;const sp=pick([30,45,60]);
    return stack([mkLayer(a,pick(POOLS.script),{max:260,rotate:pick([0,-4])}),mkLayer(b,pick(POOLS.sans),{upper:true,spacing:sp,max:120,target:700})]);},
  // dikke hoofdletters + handgeschreven accent (zoals Coffee Lovers club)
  boldHand(p){const w=p.trim().split(/\s+/);if(w.length<2)return null;const last=w.pop();const bf=pick(POOLS.bold);
    const lines=w.length>=2&&w.join(" ").length>9?splitWords(w.join(" ")):[w.join(" ")];
    const big=lines.map(t=>mkLayer(t,bf,{upper:true,max:230,spacing:3}));
    const acc=mkLayer(last,pick(POOLS.hand),{max:Math.round(big[0].size*.62),target:420,color:"accent",rotate:pick([-8,-10,-12]),dy:-10});
    acc.x=Math.round(pick([0,40,80])); return stack([...big,acc]);},
  // klein handgeschreven woordje boven, groot woord eronder
  handTop(p){const [a,b]=splitWords(p);if(!b)return null;const big=mkLayer(b,pick([...POOLS.bold,"Bebas Neue","Anton"]),{upper:true,max:300});
    const sm=mkLayer(a,pick(POOLS.hand),{max:Math.round(big.size*.6),target:420,color:"accent",rotate:-8});
    stack([sm,big]);sm.y-=Math.round(sm.size*.2);sm.x=-Math.round(Math.min(220,fitW(big)/2-fitW(sm)/2));return [sm,big];},
  // sierlijke serif cursief + kleine gespatieerde hoofdletters
  serifClean(p){const [a,b]=splitWords(p);const f=pick(POOLS.serif);const ff=FONT_BY[f];
    const top=mkLayer(a,f,{italic:!!ff.it,max:230,weight:ff.w[0]});if(!b)return [top];
    return stack([top,mkLayer(b,pick(["DM Sans","Montserrat"]),{upper:true,spacing:pick([50,70]),max:90,target:650,color:pick(["main","accent"])})]);},
  // één regel met boogje erboven
  arch(p){const [a,b]=splitWords(p);if(!b)return null;const big=mkLayer(b,pick([...POOLS.script,...POOLS.bold]),{max:260,rotate:0});
    const arc=mkLayer(a,pick(["DM Sans","Montserrat","Archivo Black"]),{upper:true,spacing:40,size:Math.round(Math.min(80,big.size*.32)),curve:pick([30,40]),color:"accent"});
    stack([arc,big]);arc.y-=Math.round(arc.size*.9+20);return [arc,big];},
  // volledig in dikke letters, gestapeld
  boldStack(p){const bf=pick(POOLS.bold);const parts=splitWords(p);return stack(parts.map((t,i)=>mkLayer(t,bf,{upper:true,max:230,color:i===parts.length-1&&parts.length>1&&Math.random()<.5?"accent":"main"})));},
  // handgeschreven met contour-woord
  outline(p){const [a,b]=splitWords(p);if(!b)return null;const f=pick(POOLS.bold);
    return stack([mkLayer(a,f,{upper:true,max:220}),mkLayer(b,f,{upper:true,max:220,style:"outline"})]);},
};
function fitW(l){const em=EMW[l.font]||EMW[poolOf(l.font)]||.5;return [...(l.upper?l.text.toUpperCase():l.text)].length*em*l.size}
const STYLE_TPL={mix:Object.keys(TEMPLATES),script:["scriptStack","scriptCaps","serifClean","arch"],bold:["boldHand","handTop","boldStack","outline","arch"],clean:["scriptCaps","serifClean","handTop","arch"]};
function generateFor(p,n,cat){
  const names=[...STYLE_TPL[genStyle]].sort(()=>Math.random()-.5);const out=[];let i=0,guard=0;
  while(out.length<n&&guard++<40){const fn=TEMPLATES[names[i++%names.length]];const layers=fn(p);if(!layers||!layers.length)continue;
    const c=GEN_COLORS[genColor];out.push({id:uid(),cat,name:p,colors:{main:c.main,accent:c.accent},shadow:0,layers,seed:false,t:Date.now()+out.length});}
  return out;
}

let aiN=4;
(function setupGenerator(){
  $("genColors").innerHTML=GEN_COLORS.map((c,i)=>`<button class="chip ${i===0?"on":""}" data-c="${i}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${c.main};border:1px solid #777"></span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${c.accent}"></span>${c.n}</button>`).join("");
  const pickOne=(id,attr,fn)=>$(id).addEventListener("click",e=>{const b=e.target.closest(`[${attr}]`);if(!b)return;fn(b.getAttribute(attr));$(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
  pickOne("genColors","data-c",v=>genColor=+v);pickOne("genStyle","data-s",v=>genStyle=v);pickOne("genCount","data-n",v=>aiN=+v);
  const inspire=list=>{$("genText").value=[...list].sort(()=>Math.random()-.5).slice(0,3).join("\n")};
  $("genInspire").onclick=()=>inspire(PHRASES_EN);$("genInspireNL").onclick=()=>inspire(PHRASES_NL);
  $("genGo").onclick=()=>{
    const lines=$("genText").value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,8),err=$("genErr");err.textContent="";
    if(!lines.length){err.textContent="Typ eerst een tekst, of tik op 💡 Inspiratie.";return}
    $("genText").blur();
    const cat=$("genCat").value.trim()||"Nieuwe ontwerpen";const made=lines.flatMap(p=>generateFor(p,aiN,cat));
    custom=[...made,...custom];if(isCustomCat(cat)&&!customCats.includes(cat))customCats.unshift(cat);saveLocal();
    loadDesign(made[0]);activeCat=cat;renderLibrary();showTab("lib");toast(`${made.length} ontwerpen in ${cat}`);
  };
})();

/* ---------------- Webapp (offline) ---------------- */
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}

/* ---------------- Start ---------------- */
loadLocal();
setDetent(0);setAppH();renderLibrary();
document.fonts.ready.then(()=>{schedulePreview();renderLibrary()});
</script>
